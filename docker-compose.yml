services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  backend:
    build:
      context: backend
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      VISION_MODE: lite
      VISION_MODEL: ${VISION_MODEL:-yolov8s-worldv2.pt}
      QDRANT_URL: http://qdrant:6333
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      API_TOKEN: ${API_TOKEN:-}
      ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  qdrant-data:
