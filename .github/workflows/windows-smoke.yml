name: Windows launcher smoke

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-launcher:
    name: Clean setup and launch
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run clean Windows setup
        shell: powershell
        run: .\setup.bat
      - name: Verify setup is idempotent
        shell: powershell
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          .\setup.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $timer.Stop()
          if ($timer.Elapsed.TotalSeconds -gt 15) {
            throw "Repeat setup took $([math]::Round($timer.Elapsed.TotalSeconds, 2)) seconds."
          }
      - name: Wait for and verify both local services
        shell: powershell
        run: .\run.bat -NoBrowser -SmokeTest
